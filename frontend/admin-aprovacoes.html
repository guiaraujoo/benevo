<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benevo - Aprovações Administrativas</title>
    
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/forms.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Shrikhand&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

</head>

<body>
    <header class="header">
        <h1 class="logo">Benevo</h1>
    </header>

   <div class="titulo-container">
      <a href="index.html" class="btn-voltar"><</a>
      <h2 class="titulo">Aprovações </h2>
    </div>
        </div>

        <table id="tabela-aprovacoes">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>CPF</th>
                    <th>Endereço</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="corpo-tabela-aprovacoes">
                <tr>
                    <td data-label="Nome">Maria Beatriz</td>
                    <td data-label="CPF">123.456.789-00</td>
                    <td data-label="Endereço">Rua das Flores, 100 - Centro</td>
                    <td data-label="Ações">
                        <button class="btn-acao btn-detalhes">Detalhes</button>
                        <button class="btn-acao btn-aprovar">Aprovar</button>
                        <button class="btn-acao btn-rejeitar">Rejeitar</button>
                    </td>
                </tr>
                <tr>
                    <td data-label="Nome">João Batista</td>
                    <td data-label="CPF">987.654.321-99</td>
                    <td data-label="Endereço">Av. Principal, 50 - Bairro Novo</td>
                    <td data-label="Ações">
                        <button class="btn-acao btn-detalhes">Detalhes</button>
                        <button class="btn-acao btn-aprovar">Aprovar</button>
                        <button class="btn-acao btn-rejeitar">Rejeitar</button>
                    </td>
                </tr>
                </tbody>
        </table>
    </main>
    
    <script>
        document.getElementById('corpo-tabela-aprovacoes').addEventListener('click', function(e) {
            if (e.target && e.target.classList.contains('btn-aprovar')) {
                const nome = e.target.closest('tr').querySelector('td[data-label="Nome"]').textContent;
                alert(`Usuário ${nome} APROVADO!`);
            } else if (e.target && e.target.classList.contains('btn-rejeitar')) {
                const nome = e.target.closest('tr').querySelector('td[data-label="Nome"]').textContent;
                alert(`Usuário ${nome} REJEITADO!`);
            } else if (e.target && e.target.classList.contains('btn-detalhes')) {
                const nome = e.target.closest('tr').querySelector('td[data-label="Nome"]').textContent;
                alert(`Mostrar detalhes completos de: ${nome}`);
            }
        });
    </script>
</body>
</html>
