<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Benevo - Cadastro Doador</title>

    <link rel="stylesheet" href="assets/css/styles.css" />
    <link rel="stylesheet" href="assets/css/forms.css" />
    
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Shrikhand&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
    <header class="header">
        <h1 class="logo">Benevo</h1>
    </header>

    <main>
        <div class="titulo-container">
            <a href="index.html" class="btn-voltar"><</a>
            <h2 class="titulo">Cadastro Doador</h2>
        </div>

        <div class="card-cadastro">
            <form id="form-cad-doador">
                
                <div class="form-group-cadastro full-width">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required />
                </div>
                
                <div class="form-group-cadastro full-width">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="seu.email@exemplo.com" required />
                </div>
                
                <div class="form-row-cadastro">
                    <div class="form-group-cadastro senha-group">
                        <label for="senha">Senha:</label>
                        <input type="password" id="senha" name="senha" required />
                        <i class="fas fa-check-circle validation-icon"></i>
                        
                        <div class="password-rules">
                            <ul>
                                <li>Mínimo 6 caracteres</li>
                                <li>Maiúscula, minúscula e número</li>
                                <li>Caracter especial</li>
                            </ul>
                        </div>
                    </div>
                    
                    <div class="form-group-cadastro cep-group">
                        <label for="cep">CEP: (Opcional)</label>
                        <input type="text" id="cep" name="cep" placeholder="00000-000" />
                    </div>
                </div>

                <div class="form-row-cadastro">
                    <div class="form-group-cadastro telefone-group">
                        <label for="telefone">Telefone (Opcional)</label>
                        <input type="tel" id="telefone" name="telefone" placeholder="(99) 99999-9999" />
                    </div>
                    
                    <div class="form-group-cadastro foto-group">
                        <label>Foto de Perfil (Opcional)</label>
                        <div class="upload-area">
                            <i class="fas fa-plus upload-icon"></i>
                            <input type="file" id="foto-perfil" name="foto-perfil" accept="image/*" class="file-input-hidden" />
                        </div>
                    </div>
                </div>
                
                <div class="form-group-cadastro full-width">
                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required />
                </div>
                
                <button type="submit" class="btn-cadastrar">Cadastrar</button>

                <p class="ja-tem-conta">Já tem uma conta? <a href="index.html">Faça login.</a></p>

            </form>
        </div>
    </main>
</body>
</html>
